#                   GNU General Public License v3.0                     #
#########################################################################
---
################################
# Basics
################################

kkrepo_name: kkrepo

################################
# Settings
################################

kkrepo_role_mysql_database: kkrepo
kkrepo_role_mysql_user: kkrepo

# Optional imports. Leave empty on a new installation and the role generates
# persistent random values with saltbox_facts. On the first migration from an
# existing deployment, set these to the existing values in the Saltbox Inventory.
kkrepo_role_mysql_root_password: ""
kkrepo_role_mysql_password: ""
kkrepo_role_credential_secret: ""
kkrepo_role_api_key_payload_secret: ""

kkrepo_role_tomcat_max_part_count: "200"
kkrepo_role_security_scanning_enabled: false

################################
# Paths
################################

kkrepo_role_paths_folder: "{{ kkrepo_name }}"
kkrepo_role_paths_location: "{{ server_appdata_path }}/{{ kkrepo_role_paths_folder }}"
kkrepo_role_paths_data_location: "{{ kkrepo_role_paths_location }}/data"
kkrepo_role_paths_mysql_location: "{{ kkrepo_role_paths_location }}/mysql"
kkrepo_role_paths_folders_list:
  - "{{ kkrepo_role_paths_location }}"
  - "{{ kkrepo_role_paths_data_location }}"
  - "{{ kkrepo_role_paths_mysql_location }}"

################################
# Web
################################

kkrepo_role_web_subdomain: "{{ kkrepo_name }}"
kkrepo_role_web_domain: "{{ user.domain }}"
kkrepo_role_web_port: "8080"
kkrepo_role_web_url: "{{ lookup('role_web', role='kkrepo', scheme='https') }}"

################################
# DNS
################################

kkrepo_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='kkrepo') }}"
kkrepo_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='kkrepo') }}"
kkrepo_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

# Repository clients such as Maven and Gradle must be able to authenticate
# directly against kkRepo, so SSO is intentionally disabled by default.
kkrepo_role_traefik_sso_middleware: ""
kkrepo_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
kkrepo_role_traefik_middleware_custom: ""
kkrepo_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
kkrepo_role_traefik_middleware_custom_api: ""
kkrepo_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
kkrepo_role_traefik_enabled: true
kkrepo_role_traefik_api_enabled: false
kkrepo_role_traefik_api_endpoint: ""

################################
# Docker - kkRepo
################################

# Container
kkrepo_role_docker_container: "{{ kkrepo_name }}"

# Image
kkrepo_role_docker_image_pull: true
kkrepo_role_docker_image_repo: "ghcr.io/klboke/kkrepo"
kkrepo_role_docker_image_tag: "latest"
kkrepo_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='kkrepo') }}:{{ lookup('role_var', '_docker_image_tag', role='kkrepo') }}"

# Envs
kkrepo_role_docker_envs_default:
  TZ: "{{ tz }}"
  KKREPO_DATABASE_TYPE: mysql
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ kkrepo_mysql_name }}:3306/{{ lookup('role_var', '_mysql_database', role='kkrepo') }}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone={{ tz }}&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "{{ lookup('role_var', '_mysql_user', role='kkrepo') }}"
  SPRING_DATASOURCE_PASSWORD: "{{ kkrepo_saltbox_facts.facts.mysql_password }}"
  KKREPO_CREDENTIAL_SECRET: "{{ kkrepo_saltbox_facts.facts.credential_secret }}"
  KKREPO_API_KEY_PAYLOAD_SECRET: "{{ kkrepo_saltbox_facts.facts.api_key_payload_secret }}"
  KKREPO_FILE_BASE_DIR: /var/lib/kkrepo/blobs
  SERVER_TOMCAT_MAX_PART_COUNT: "{{ lookup('role_var', '_tomcat_max_part_count', role='kkrepo') }}"
  KKREPO_SECURITY_SCANNING_ENABLED: "{{ lookup('role_var', '_security_scanning_enabled', role='kkrepo') | string | lower }}"
kkrepo_role_docker_envs_custom: {}
kkrepo_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='kkrepo')
                              | combine(lookup('role_var', '_docker_envs_custom', role='kkrepo')) }}"

# Volumes
kkrepo_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_data_location', role='kkrepo') }}:/var/lib/kkrepo"
kkrepo_role_docker_volumes_custom: []
kkrepo_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='kkrepo')
                                 + lookup('role_var', '_docker_volumes_custom', role='kkrepo') }}"

# Hostname
kkrepo_role_docker_hostname: "{{ kkrepo_name }}"

# Networks
kkrepo_role_docker_networks_alias: "{{ kkrepo_name }}"
kkrepo_role_docker_networks_default: []
kkrepo_role_docker_networks_custom: []
kkrepo_role_docker_networks: "{{ docker_networks_common
                                  + lookup('role_var', '_docker_networks_default', role='kkrepo')
                                  + lookup('role_var', '_docker_networks_custom', role='kkrepo') }}"

# Restart Policy
kkrepo_role_docker_restart_policy: unless-stopped

################################
# Docker - MySQL
################################

kkrepo_mysql_name: "{{ kkrepo_name }}-mysql"

# Container
kkrepo_mysql_role_docker_container: "{{ kkrepo_mysql_name }}"

# Image
kkrepo_mysql_role_docker_image_pull: true
kkrepo_mysql_role_docker_image_repo: mysql
kkrepo_mysql_role_docker_image_tag: "8.0"
kkrepo_mysql_role_docker_image: "{{ kkrepo_mysql_role_docker_image_repo }}:{{ kkrepo_mysql_role_docker_image_tag }}"

# Envs
kkrepo_mysql_role_docker_envs:
  TZ: "{{ tz }}"
  MYSQL_ROOT_PASSWORD: "{{ kkrepo_saltbox_facts.facts.mysql_root_password }}"
  MYSQL_DATABASE: "{{ lookup('role_var', '_mysql_database', role='kkrepo') }}"
  MYSQL_USER: "{{ lookup('role_var', '_mysql_user', role='kkrepo') }}"
  MYSQL_PASSWORD: "{{ kkrepo_saltbox_facts.facts.mysql_password }}"

# Volumes
kkrepo_mysql_role_docker_volumes:
  - "{{ lookup('role_var', '_paths_mysql_location', role='kkrepo') }}:/var/lib/mysql"

# Labels
# Avoid inheriting kkRepo's Traefik labels on the database container.
kkrepo_mysql_role_docker_labels_use_common: false
kkrepo_mysql_role_docker_labels: {}

# Hostname
kkrepo_mysql_role_docker_hostname: "{{ kkrepo_mysql_name }}"

# Networks
kkrepo_mysql_role_docker_networks_alias: "{{ kkrepo_mysql_name }}"
kkrepo_mysql_role_docker_networks:
  - name: "{{ docker_networks_name_common }}"
    aliases:
      - "{{ kkrepo_mysql_name }}"

# Healthcheck
kkrepo_mysql_role_docker_healthcheck:
  test:
    - CMD-SHELL
    - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

# Restart Policy
kkrepo_mysql_role_docker_restart_policy: unless-stopped
