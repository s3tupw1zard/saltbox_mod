---
- name: Add SilverBullet DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record', role='silverbullet') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone', role='silverbullet') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy', role='silverbullet') }}"

- name: Remove existing SilverBullet Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Create SilverBullet directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Create SilverBullet Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"
